<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Change PIN</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-box">

    <h1>🔐 Change PIN</h1>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          action="{{ url_for('change_pin') }}">

        <label>Current PIN</label>

        <input
            type="password"
            name="current_pin"
            maxlength="4"
            placeholder="Current PIN"
            required
        >


        <label>New PIN</label>

        <input
            type="password"
            name="new_pin"
            maxlength="4"
            placeholder="New 4 Digit PIN"
            required
        >


        <label>Confirm New PIN</label>

        <input
            type="password"
            name="confirm_pin"
            maxlength="4"
            placeholder="Confirm New PIN"
            required
        >


        <button type="submit">
            CHANGE PIN
        </button>

    </form>


    <a href="{{ url_for('dashboard') }}"
       class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
