<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot PIN</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-box">

    <h1>🔑 Forgot PIN</h1>

    <p class="subtitle">
        Verify your account
    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          action="{{ url_for('forgot_pin') }}">

        <label>Account Number</label>

        <input
            type="text"
            name="account_no"
            placeholder="Enter Account Number"
            required
        >


        <label>Registered Mobile Number</label>

        <input
            type="text"
            name="mobile"
            placeholder="Enter Mobile Number"
            maxlength="10"
            required
        >


        <button type="submit">
            GENERATE OTP
        </button>

    </form>


    <a href="{{ url_for('home') }}"
       class="back-btn">
        ← Back to Login
    </a>

</div>

</body>
</html>
