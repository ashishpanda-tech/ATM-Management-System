<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OTP Verification</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-box">

    <h1>🔐 OTP Verification</h1>

    <p class="subtitle">
        Enter the 6-digit OTP
    </p>


    <div class="demo-otp">

        <p>Demo OTP</p>

        <h2>{{ otp }}</h2>

        <small>
            For project demonstration
        </small>

    </div>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          action="{{ url_for('verify_otp') }}">

        <label>Enter OTP</label>

        <input
            type="text"
            name="otp"
            placeholder="Enter 6 Digit OTP"
            maxlength="6"
            required
        >


        <button type="submit">
            VERIFY OTP
        </button>

    </form>


    <a href="{{ url_for('forgot_pin') }}"
       class="back-btn">
        ← Back
    </a>

</div>

</body>
</html>
